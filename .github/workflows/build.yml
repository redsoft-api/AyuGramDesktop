name: Build AyuGramDesktop (Linux Docker)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: false

      - name: Force Poetry to use project venv (avoid touching system python)
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry config experimental.new-installer false || true
          poetry --version

      - name: Prepare libraries (use local .venv, non-interactive)
        env:
          POETRY_VIRTUALENVS_CREATE: "true"
          POETRY_VIRTUALENVS_IN_PROJECT: "true"
          POETRY_NO_INTERACTION: "1"
        run: |
          chmod +x ./Telegram/build/prepare/linux.sh
          ./Telegram/build/prepare/linux.sh

      - name: Build project (Release) inside Docker
        run: |
          docker run --rm \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Strip binaries
        run: |
          find out -type f -executable -exec strip {} + || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-linux-build
          path: out
